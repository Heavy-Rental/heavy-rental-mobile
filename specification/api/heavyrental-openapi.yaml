openapi: 3.0.3
info:
  title: Heavy Rental API
  description: |
    HTTP API for the Heavy Rental mobile operations app (deliveries & returns).

    **v1 mobile client behaviour:**
    - Loads Delivery List via `GET /api/deliveries` and Return List via
      `GET /api/returns` (server/mock applies today membership; see
      specification/domain/list-filters.md).
    - May also load `GET /api/bookings` for shared booking state; does not
      rebuild list screens by re-filtering bookings with device LocalDate.now().
    - Updates status via delivery/return PATCH endpoints.
    - Auth is an interim → access JWT handshake (getBearerToken → login → logout).
      Contract mirrors heavy-rental-spring-rest-api's
      specification/SPEC-auth-login-logout.md, which is the source of truth for
      server-side behaviour (password verification, denylist, token claims).
      **The local Mockoon mock only returns static canned responses for these
      three routes** — it does not verify credentials or issue real JWTs. Use
      the real Spring Boot backend to exercise actual login/logout behaviour.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local mock / host machine
  - url: http://10.0.2.2:8081
    description: Android emulator → host localhost

tags:
  - name: Auth
  - name: Bookings
  - name: Deliveries
  - name: Returns

paths:
  /api/auth/getBearerToken:
    get:
      tags: [Auth]
      operationId: getBearerToken
      summary: Mint a short-lived interim JWT
      description: |
        Step 1 of login. No credentials required. Response is a raw JWT string
        (`text/plain`), not JSON. See specification/product/01-login.md.

        Full contract owned by heavy-rental-spring-rest-api's
        SPEC-request-bearer-token.md — this mock only returns a fixed
        placeholder token, it does not sign real JWTs.
      responses:
        "200":
          description: Interim JWT (plain text body, not JSON)
          content:
            text/plain:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiJ9.mock-interim-token-for-local-mock-testing-only.mock-signature

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Upgrade an interim JWT to an access (session) JWT
      description: |
        Step 2 of login. Requires the interim JWT from getBearerToken as a
        Bearer token, plus email/password in the body. See
        specification/product/01-login.md and, for full server behaviour,
        heavy-rental-spring-rest-api's SPEC-auth-login-logout.md §6.1.

        **Mock caveat:** this Mockoon route returns the same canned 200
        response for any request body — it does not check the password or the
        interim token. Use the real backend to test 400/401/403 paths.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "Bearer <interim-jwt>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                sample:
                  $ref: "#/components/examples/LoginResponseExample"
        "400":
          description: Blank email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing/invalid/expired/reused interim token, or wrong credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: An access token (not an interim token) was used as the Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access JWT
      description: |
        Step 4 of the flow. Requires the access JWT (from login) as a Bearer
        token. See heavy-rental-spring-rest-api's SPEC-auth-login-logout.md §6.2.

        **Mock caveat:** this Mockoon route always returns 200 — it does not
        validate or actually revoke the Bearer token.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            example: "Bearer <access-jwt>"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                sample:
                  $ref: "#/components/examples/LogoutResponseExample"
        "403":
          description: An interim token (not an access token) was used as the Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/bookings:
    get:
      tags: [Bookings]
      operationId: getBookings
      summary: List all bookings
      description: Primary data load for the v1 Android client.
      responses:
        "200":
          description: Array of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
              examples:
                sample:
                  $ref: "#/components/examples/BookingList"

  /api/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get a single booking
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
    put:
      tags: [Bookings]
      operationId: updateBooking
      summary: Replace a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found

  /api/deliveries:
    get:
      tags: [Deliveries]
      operationId: getTodaysDeliveries
      summary: Today's delivery items
      description: |
        Bookings with startDate = today and status CONFIRMED or MOBILISED
        (see specification/domain/list-filters.md). v1 mobile **loads this
        endpoint for the Delivery List and home delivery counts** — it does
        not re-filter the response by device LocalDate.now().
      responses:
        "200":
          description: Today's deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryItem"
              examples:
                sample:
                  $ref: "#/components/examples/DeliveryList"

  /api/deliveries/{bookingId}/status:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    patch:
      tags: [Deliveries]
      operationId: updateDeliveryStatus
      summary: Update delivery booking status
      description: |
        v1 client uses this for CONFIRMED → MOBILISED.
        Body field bookingStatus must be a valid BookingStatus string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
            examples:
              mobilise:
                value:
                  bookingStatus: MOBILISED
      responses:
        "200":
          description: Updated delivery item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryItem"
        "400":
          description: Invalid transition or body
        "404":
          description: Booking not found

  /api/returns:
    get:
      tags: [Returns]
      operationId: getTodaysReturns
      summary: Today's return items
      description: |
        Bookings with endDate = today and status MOBILISED or COMPLETED
        (see specification/domain/list-filters.md). v1 mobile **loads this
        endpoint for the Return List and home return counts** — it does not
        re-filter the response by device LocalDate.now().
      responses:
        "200":
          description: Today's returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReturnItem"
              examples:
                sample:
                  $ref: "#/components/examples/ReturnList"

  /api/returns/{bookingId}/status:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    patch:
      tags: [Returns]
      operationId: updateReturnStatus
      summary: Update return booking status
      description: |
        v1 client uses this for MOBILISED → COMPLETED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
            examples:
              complete:
                value:
                  bookingStatus: COMPLETED
      responses:
        "200":
          description: Updated return item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnItem"
        "400":
          description: Invalid transition or body
        "404":
          description: Booking not found

components:
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 3

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: admin@localhost
        password:
          type: string
          example: admin1234

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - username
      properties:
        accessToken:
          type: string
          description: Session JWT
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the access token expires
          example: 3600
        username:
          type: string
          description: Legacy field name — value is the authenticated email
          example: admin@localhost

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Logged out successfully

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: invalid_credentials
        message:
          type: string
          example: Invalid email or password.

    BookingStatus:
      type: string
      enum: [PENDING_DEPOSIT, PENDING_CONFIRMED, CONFIRMED, MOBILISED, COMPLETED, CANCELLED]
      description: Hire lifecycle status (see specification/domain/booking-status-machine.md)

    Booking:
      type: object
      required:
        - bookingId
        - customerName
        - startDate
        - endDate
        - bookingStatus
        - siteAddress
        - assetName
        - serialNumber
        - deliveryNotes
      properties:
        bookingId:
          type: integer
          format: int64
          example: 1
        customerName:
          type: string
          example: Lim Construction Pte Ltd
        startDate:
          type: string
          format: date
          description: ISO-8601 date (yyyy-MM-dd)
          example: "2026-08-03"
        endDate:
          type: string
          format: date
          example: "2026-08-10"
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"
        siteAddress:
          type: string
          example: 18 Tuas South Ave 14, Singapore 637471
        assetName:
          type: string
          example: CAT 320 Hydraulic Excavator
        serialNumber:
          type: string
          example: CAT 320 GC
        deliveryNotes:
          type: string
          example: ""

    DeliveryItem:
      type: object
      required:
        - bookingId
        - customerName
        - startDate
        - siteAddress
        - assetName
        - serialNumber
        - deliveryNotes
        - bookingStatus
      properties:
        bookingId:
          type: integer
          format: int64
        customerName:
          type: string
        startDate:
          type: string
          format: date
        siteAddress:
          type: string
        assetName:
          type: string
        serialNumber:
          type: string
        deliveryNotes:
          type: string
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"

    ReturnItem:
      type: object
      required:
        - bookingId
        - customerName
        - endDate
        - siteAddress
        - assetName
        - serialNumber
        - deliveryNotes
        - bookingStatus
      properties:
        bookingId:
          type: integer
          format: int64
        customerName:
          type: string
        endDate:
          type: string
          format: date
        siteAddress:
          type: string
        assetName:
          type: string
        serialNumber:
          type: string
        deliveryNotes:
          type: string
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"

    StatusUpdateRequest:
      type: object
      required:
        - bookingStatus
      properties:
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"

  examples:
    LoginResponseExample:
      summary: Canned access token (mock only — see path description)
      externalValue: ./examples/login-response.json
    LogoutResponseExample:
      summary: Canned logout confirmation (mock only)
      externalValue: ./examples/logout-response.json
    BookingList:
      summary: Sample bookings (fixed date 2026-08-03 as "today")
      externalValue: ./examples/bookings.json
    DeliveryList:
      summary: Sample deliveries
      externalValue: ./examples/deliveries.json
    ReturnList:
      summary: Sample returns
      externalValue: ./examples/returns.json