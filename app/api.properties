# REST API backend for the Android client (emulator).
#
# MOCKOON     → http://10.0.2.2:8081/  (host machine: localhost:8081)
# SPRING_BOOT → http://10.0.2.2:8080/  (host machine: localhost:8080)
#
# Override per machine without dirtying this file by setting the same key in
# the repo-root local.properties (gitignored):
#   api.server.target=SPRING_BOOT
#
# After changing this value: Sync Gradle / Rebuild, then Run.

api.server.target=SPRING_BOOT
